name: Frontend and backend CI
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/pip install -e './backend[dev,mcp]'
      - run: npm ci
      - run: cd backend && .venv/bin/python -m pytest -q
      - run: ./scripts/migration_guard.sh
      - run: npm run test:interactions && npm run test:models && node --test terminal-ui/tests/*.test.mjs && npm run build:public
      - run: python scripts/secret_scan.py
  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: controlled-ci-only
          POSTGRES_DB: terminal_migration_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:controlled-ci-only@localhost:5432/terminal_migration_ci
      LEGACY_TENANT_USER_ID: migration-ci-owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e './backend[dev]'
      - name: Verify actual PostgreSQL upgrade and model parity
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python -m alembic check
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e './backend[dev,mcp]' pip-audit bandit
      - run: pip-audit
      - run: bandit -r backend/app -lll
      - run: npm ci && npm audit --omit=dev --audit-level=high
