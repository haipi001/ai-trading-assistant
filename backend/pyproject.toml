[project]
name = "ai-trading-os-backend"
version = "0.1.0"
description = "FastAPI backend for AI Trading OS"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13.0",
  "certifi>=2024.8.30",
  "fastapi>=0.115.0",
  "psycopg[binary]>=3.2.0",
  "psycopg2-binary>=2.9.0",
  "pydantic-settings>=2.6.0",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
production = [
  "boto3>=1.35.0",
]
mcp = [
  "mcp>=1.0.0,<2",
]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
