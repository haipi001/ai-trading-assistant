<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交易终端 · 本机数据迁移</title></head><body><main><header><span>TERMINAL / LOCAL DATA</span><h1>迁移本机研究数据</h1><p id="origin"></p></header><p>先在旧版所在地址导出，再到新终端导入。自选、布局、画线、笔记和脚本保留原格式；账户授权、会话和交易账本继续由原系统管理。</p><section><h2>1 · 导出当前地址的数据</h2><button id="export">导出本机数据包</button><p>localhost 与 127.0.0.1 的浏览器存储相互独立，请使用旧版原来的地址。</p></section><section><h2>2 · 预览数据包</h2><label>选择 JSON 文件 <input id="file" type="file" accept=".json,application/json"></label><details><summary>或粘贴数据包</summary><textarea id="paste" aria-label="本机数据包JSON" rows="6"></textarea><button id="preview-paste">预览粘贴内容</button></details><p id="source"></p><div id="preview"></div></section><section><h2>3 · 应用已选择条目</h2><p>同名条目默认保留本机内容。选中已有条目会替换它；迁移前会保存可恢复备份，空间不足时停止写入。</p><button id="apply" disabled>迁移已选择条目</button><button id="restore">恢复迁移前数据</button><p>完成后刷新新终端以载入数据。脚本只作为本机草稿，不会被自动编译、执行或下单。</p></section><p id="status" role="status">尚未选择数据包。</p><footer><a href="/">返回所在前端首页</a></footer></main><script type="module" src="/src/local-data-migration-ui.js"></script></body></html>
